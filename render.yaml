# Render Blueprint — loja ESTILO DE ARTISTA.
#
# Cópia do código da A Fonte (que é cópia da Nation 47), não uma segunda
# instância: o app é de UMA loja por instalação (a personalização mora numa
# chave única do banco), então cada loja é um serviço, com disco e chaves
# próprios. Correção feita aqui não chega nas outras, e vice-versa.
#
# O serviço foi criado pela API do Render em 14/09/2026
# (srv-dajv6g7qj5pc73f7abeg), como o da A Fonte, e NÃO por este blueprint:
# editar este arquivo não muda nada no que está rodando. Quem manda é o painel
# (Environment). Este arquivo fica como a descrição de como o serviço é.
#
# Plano Starter (NÃO free: o free hiberna e mata o checkout entre gerar o PIX e
# o pagamento chegar). Virginia: a região mais perto do Brasil, e o checkout
# PIX é sensível a latência.
services:
  - type: web
    name: estilo-de-artista-checkout
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    # Disco persistente: sem ele o SQLite vive no filesystem efemero e SOME a
    # cada deploy. Perder o banco entre gerar o PIX e o cliente pagar faz o
    # postback chegar sem pedido correspondente -> pedido pago que nunca
    # aparece. Tambem guarda as chaves VAPID do push e o gateway ativo.
    disk:
      name: checkout-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: CURRENCY
        value: BRL

      # ------------------------------------------------------------- MARCA
      - key: LOJA_NOME
        value: "Estilo de Artista"
      - key: LOJA_NOME_COMPLETO
        value: "Estilo de Artista"
      # Logo gerada de assets/_originais/ por assets/_fonte/gerar-logo.mjs.
      # Transparente nos fundos escuros; no topo claro do checkout vai a com
      # contorno preto nas letras, porque o amarelo-neon some no branco (ate
      # 14/09/2026 era a do quadro preto inteiro). Em arquivo, e nao
      # so no /admin: a arte enviada pelo painel mora no BANCO, e um reset de
      # disco levaria ela junto.
      - key: LOJA_LOGO
        value: /assets/logo-estilo-de-artista.png
      - key: LOJA_LOGO_CLARO
        value: /assets/logo-estilo-de-artista-fundo-claro.png
      #
      # Depoimentos DESLIGADOS: a lista DEPOIMENTOS em src/views/pages.js esta
      # vazia (os da A Fonte sao de clientes dela e nao vieram).
      - key: LOJA_DEPOIMENTOS
        value: "0"
      # TROQUE pelo e-mail real de atendimento (sai no rodape e nos termos).
      - key: LOJA_EMAIL
        sync: false
      # CNPJ/CPF de quem responde pela loja nos termos e na politica. Vazio =
      # a linha some dos documentos. NAO usar o da A Fonte.
      - key: LOJA_CNPJ
        sync: false
      # Instagram e foto do "Quem e": vazios fazem as secoes sumirem da home.
      - key: LOJA_INSTAGRAM
        value: https://www.instagram.com/estilo_de_artista_/
      # Foto do bloco "Quem e" (parede de tenis com o letreiro).
      - key: LOJA_FOTO_SOBRE
        value: /assets/loja-fachada.webp

      # ------------------------------------------------------------ PRECOS
      # 1 par R$ 99,00, 2 pares R$ 149,00 (desde 13/09/2026). A promo reconhece
      # o par pelo preco EXATO: nada que nao seja tenis pode custar 99,00.
      # Preco de venda do Type "Tenis". Vale no import do CSV E a cada boot.
      # Outros Types (camisa, blusa, calca, chinelo, acessorios) usam o preco
      # do proprio CSV. Ver src/checkout/seed.js.
      #
      # O "R$ 149" esta DESENHADO no banner do topo (arte do dono, originais em
      # assets/_originais/). Mudou o preco? precisa de arte nova.
      - key: CATALOGO_PRECO_CENTS
        value: "9900"
      #   par elegivel R$ 99,00       -> 9900
      #   2 pares cheios R$ 198,00    -> 19800
      #   desconto 19800 x 4900/19800 -> R$ 49,00
      #   total                       -> R$ 149,00
      - key: PROMO_ELIGIBLE_PRICE_CENTS
        value: "9900"
      - key: PROMO_MIN_QTY
        value: "2"
      - key: PROMO_NUM
        value: "4900"
      - key: PROMO_DEN
        value: "19800"
      - key: PROMO_LABEL
        value: "PROMO 2 PARES"

      # Oferta pos-compra DESLIGADA, como na A Fonte (o codigo liga por padrao
      # quando a variavel falta, por isso ela esta declarada).
      - key: UPSELL_ATIVO
        value: "0"
      - key: UPSELL_PRECO_CENTS
        value: "6900"
      - key: UPSELL_JANELA_MIN
        value: "30"
      - key: UPSELL_MAX_ITENS
        value: "10"

      # ---------------------------------------------------------- SEGREDOS
      # Nada de chave aqui: preencher no painel do Render (sync: false).
      #
      # Esta loja NAO herdou conta de pagamento. As da A Fonte (Coreon propria
      # dela, UmbrellaPag "Dripzone Sneakers") ficaram de fora: vender com elas
      # mandaria o dinheiro para outra loja. Ao ligar uma conta:
      #  - COREON: webhook e cadastrado UMA vez por conta, no painel da Coreon,
      #    apontando para https://<servico>.onrender.com/webhooks/coreon. Sem
      #    isso o cliente paga e o pedido fica pendente, sem erro aparecer.
      #    COREON_WEBHOOK_SECRET vazio funciona; PREENCHIDO E ERRADO descarta
      #    todo postback.
      #  - UMBRELLA: a URL de retorno vai por cobranca; so a chave.
      #  - Trocar o texto da conta em GATEWAYS_DA_LOJA (src/routes/admin.js).
      #  - FB_PIXEL_ID / UTMIFY: os de outra loja misturam as vendas.
      - key: DEFAULT_GATEWAY
        sync: false
      - key: UMBRELLA_BASE_URL
        sync: false
      - key: UMBRELLA_API_KEY
        sync: false
      - key: COREON_BASE_URL
        sync: false
      - key: COREON_API_KEY
        sync: false
      - key: COREON_API_SECRET
        sync: false
      - key: COREON_WEBHOOK_SECRET
        sync: false
      - key: SOLUTION_BASE_URL
        sync: false
      - key: SOLUTION_API_KEY
        sync: false
      - key: PAYSHARK_BASE_URL
        sync: false
      - key: PAYSHARK_API_KEY
        sync: false
      - key: PIXGATE_BASE_URL
        sync: false
      - key: PIXGATE_API_KEY
        sync: false
      - key: FB_PIXEL_ID
        sync: false
      - key: FB_CAPI_TOKEN
        sync: false
      - key: FB_TEST_EVENT_CODE
        sync: false
      - key: UTMIFY_PIXEL_ID
        sync: false
      - key: UTMIFY_API_TOKEN
        sync: false
      # Painel /admin (defina uma senha FORTE):
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
